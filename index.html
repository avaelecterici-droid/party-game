<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#080d1d;--panel:rgba(18,27,53,.92);--ink:#f0f5ff;--soft:#a8b6d9;
--hot:#ffca66;--ok:#54e6a5;--bad:#ff6b91;--line:rgba(135,160,230,.25);

}
html,body{height:100%}
body{
background:radial-gradient(ellipse at 85% -5%,rgba(137,72,255,.28),transparent 45%),
radial-gradient(ellipse at 5% 45%,rgba(34,211,238,.12),transparent 42%),
linear-gradient(145deg,#080d1d,#10152d 58%,#090d1d);
background-attachment:fixed;color:var(--ink);
font-family:Vazirmatn,Tahoma,sans-serif;
display:flex;justify-content:center;align-items:flex-start;
padding:clamp(10px,3vw,24px);min-height:100vh;
}
main{width:100%;max-width:1000px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;letter-spacing:-.5px;
background:linear-gradient(100deg,#fff0bd,#65f1e5 45%,#bd9bff 85%);
-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px #4b7aff30);margin-bottom:4px}
.sub{color:var(--soft);line-height:1.9;font-size:clamp(.9rem,2.5vw,1.05rem)}
.btn{font:inherit;font-weight:900;font-size:clamp(.95rem,2.8vw,1.1rem);
padding:clamp(10px,2.5vw,14px) clamp(20px,5vw,36px);border-radius:16px;border:0;
background:linear-gradient(115deg,#ffd783,#ffb84d);color:#201532;
box-shadow:0 4px 0 #b66c37,0 8px 24px #ffbd5930;cursor:pointer;
transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b66c37}
.btn.sm{padding:8px 18px;font-size:clamp(.8rem,2.2vw,.95rem)}
.btn.ghost{background:#ffffff0f;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.card{background:linear-gradient(150deg,rgba(23,34,65,.95),rgba(13,21,43,.96));
border:1px solid #8ca6ee3d;border-radius:26px;
padding:clamp(16px,4vw,28px);box-shadow:0 24px 70px #0005,inset 0 1px #ffffff0b;
backdrop-filter:blur(14px);margin-bottom:16px}
.teams{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
.team{flex:1;min-width:140px;padding:14px 18px;border-radius:18px;
border:2px solid transparent;background:#ffffff08;transition:.3s;position:relative}
.team.active{border-color:var(--hot);background:#ffca6615;box-shadow:0 0 30px #ffca6622}
.team .name{font-weight:900;font-size:clamp(1rem,3vw,1.3rem);display:flex;align-items:center;gap:8px}
.team .score{font-size:clamp(2rem,6vw,3rem);font-weight:900;line-height:1.1;margin-top:4px}
.team.t1 .score,.team.t1 .name{color:var(--t1)}
.team.t2 .score,.team.t2 .name{color:var(--t2)}
.team .turn-badge{position:absolute;top:-10px;left:14px;background:var(--hot);color:#201532;
font-size:.75rem;font-weight:900;padding:2px 10px;border-radius:20px;display:none}
.team.active .turn-badge{display:block}
.timer-wrap{height:14px;border-radius:7px;background:#ffffff12;overflow:hidden;margin:10px 0}
.timer-bar{height:100%;width:100%;background:linear-gradient(90deg,#54e6a5,#ffca66,#ff6b91);
transition:width .2s linear;border-radius:7px}
.timer-text{text-align:center;font-weight:900;font-size:clamp(1.2rem,3.5vw,1.6rem);color:var(--hot);margin:4px 0}
.question{font-size:clamp(1.2rem,3.8vw,1.8rem);font-weight:900;line-height:1.8;margin:18px 0;text-align:center}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-weight:800;font-size:clamp(.95rem,2.8vw,1.15rem);
padding:16px 12px;border-radius:16px;border:2px solid var(--line);
background:#202d50;color:#eaf1ff;cursor:pointer;transition:.16s;min-height:60px}
.opt:hover{border-color:#5de6dd;transform:translateY(-2px)}
.opt:disabled{opacity:.6;cursor:default;transform:none}
.opt.correct{background:#155c51;border-color:var(--ok);color:#e8fff7}
.opt.wrong{background:#65283f;border-color:var(--bad);color:#fff}
.fb{text-align:center;font-weight:900;font-size:clamp(1rem,2.8vw,1.2rem);min-height:2em;margin:10px 0}
.hidden{display:none!important}
.pantomime-word{font-size:clamp(1.8rem,7vw,3.4rem);font-weight:900;text-align:center;
padding:30px;border-radius:24px;background:linear-gradient(145deg,#6656f4,#2dd4bf);
color:#fff;box-shadow:0 20px 60px #6c5ce755;margin:16px 0;line-height:1.4}
.poem-line{font-size:clamp(1.3rem,4vw,2rem);font-weight:700;text-align:center;
line-height:2;margin:20px 0;padding:20px;border-radius:20px;
background:linear-gradient(160deg,#F6E7C1,#E3CB94);color:#3B2A14;
box-shadow:inset 0 0 0 3px #B88A3E}
.img-box{width:100%;max-height:50vh;border-radius:20px;overflow:hidden;
margin:16px 0;box-shadow:0 20px 50px #0006;border:2px solid var(--line);background:#0a1020}
.img-box svg,.img-box img{width:100%;height:auto;display:block}
.spin-wheel{width:min(300px,80vw);height:min(300px,80vw);border-radius:50%;
margin:20px auto;position:relative;
background:conic-gradient(var(--t1) 0deg 45deg,var(--hot) 45deg 90deg,
var(--bad) 90deg 135deg,var(--t2) 135deg 180deg,
var(--t1) 180deg 225deg,var(--hot) 225deg 270deg,
var(--bad) 270deg 315deg,var(--t2) 315deg 360deg);
box-shadow:0 0 0 8px #ffffff15,0 20px 60px #0006;transition:transform 3s cubic-bezier(.17,.67,.12,1)}
.wheel-center{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem}
.wheel-pointer{text-align:center;font-size:2rem;margin-bottom:-8px}
.wheel-result{text-align:center;font-weight:900;font-size:clamp(1.1rem,3.5vw,1.6rem);
margin:16px 0;min-height:2.5em;padding:16px;border-radius:16px;background:#ffffff0a}
.player-input{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.player-input input{font:inherit;padding:12px 16px;border-radius:14px;border:2px solid var(--line);
background:#ffffff0a;color:var(--ink);font-size:1rem;width:200px;text-align:center}
.player-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;
background:#ffffff0f;font-weight:700;font-size:.9rem;border:1px solid var(--line)}
.players-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.awards{display:grid;gap:10px;margin:16px 0}
.award{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;
background:#ffffff08;border:1px solid var(--line)}
.award .icon{font-size:1.8rem}
.award .text{font-weight:700}
.stage-dots{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.stage-dot{width:10px;height:10px;border-radius:50%;background:#526083;transition:.3s}
.stage-dot.done{background:var(--t1);box-shadow:0 0 10px #5ce5d766}
.stage-dot.current{background:var(--hot);box-shadow:0 0 14px #ffca6688;transform:scale(1.4)}
.footer-nav{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.turn-info{text-align:center;padding:10px;background:#ffffff08;border-radius:12px;
font-weight:700;font-size:clamp(.95rem,2.8vw,1.1rem);margin-bottom:12px}
.turn-info .tname{font-weight:900}
.turn-info .t1{color:var(--t1)}.turn-info .t2{color:var(--t2)}
@media(max-width:480px){.team{padding:10px 12px}.team .score{font-size:2rem}}
main{position:relative;z-index:1}
.fl{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fl span{position:absolute;bottom:-60px;opacity:.13;animation:fly linear infinite}
@keyframes fly{to{transform:translateY(-120vh) rotate(360deg)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:99}
.c{text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pop{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.intro{text-align:center;padding:18px 6px}
.intro .big{font-size:clamp(4.5rem,20vw,8rem);display:inline-block;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(7deg)}}
.intro h2{font-size:clamp(1.5rem,6vw,2.4rem);margin:6px 0}
.eq{display:flex;gap:4px;height:46px;align-items:flex-end;justify-content:center;margin:14px 0}
.eq i{width:7px;height:8px;background:#fff;border-radius:4px}
.eq.on i{animation:eq .5s ease-in-out infinite alternate}
.eq.on i:nth-child(2n){animation-delay:.12s}.eq.on i:nth-child(3n){animation-delay:.25s}
@keyframes eq{to{height:46px}}
.who{text-align:center;font-weight:900;color:var(--hot);margin:6px 0;font-size:1.05rem}
.chip{display:inline-block;padding:4px 14px;border-radius:20px;margin:4px;font-weight:700;background:#ffffff1c}
.bigcard{animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.wlab{position:absolute;left:50%;top:50%;font-size:1.7rem;margin:-.85rem 0 0 -.85rem;transform:rotate(var(--a)) translateY(calc(var(--r)*-1))}
.spin-wheel{--r:calc(min(300px,80vw)*.36)}
.tb{display:flex;gap:6px}.tb .btn{padding:6px 12px}
.tinp{font:inherit;font-weight:900;background:transparent;border:0;border-bottom:2px dashed var(--line);color:inherit;width:100%;font-size:1.1rem}
.vit{display:inline-flex;gap:8px;align-items:center;background:#ffffff0f;border:1px solid var(--line);border-radius:20px;padding:4px 12px;margin:3px;font-weight:700}
.vit b{cursor:pointer}
body.tv main{max-width:none;width:96%;zoom:1.3}
@media(min-width:820px) and (orientation:landscape){body main{max-width:1400px;zoom:1.2}}
body.tv #tvb{opacity:.45}
</style>

<script>
const $=id=>document.getElementById(id),fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)],
shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a},app=$('app');
/* ===== صدا ===== */
let AC=null,mute=false,mus=null;
const ctx=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
function snd(f,d=.12,type='sine',v=.15,f2,dl=0){try{if(mute)return;const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+dl;
o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d=.2,v=.2,fc=1800,dl=0){try{if(mute)return;const c=ctx(),n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime+dl;s.buffer=b;f.type='bandpass';f.frequency.value=fc;
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}catch(e){}}
const seq=(n,st=.09,ty='triangle',d=.2,v=.15)=>n.forEach((f,i)=>snd(f,d,ty,v,0,i*st));
const sfx={tick:()=>snd(800,.06,'square',.07),urgent:()=>snd(1100,.09,'square',.12),
good:()=>seq([660,880,1320],.08),bad:()=>{snd(300,.45,'sawtooth',.12,80);snd(150,.3,'square',.08,60,.1)},
win:()=>{seq([523,659,784,1047,784,1047,1319],.11);sfx.clap()},lose:()=>seq([392,330,262,196],.18,'sawtooth',.1),
ding:()=>seq([1200,1800],.07,'sine',.12),whoosh:()=>{snd(200,.4,'sine',.12,1400);noise(.35,.12,3000)},
clap:()=>{for(let i=0;i<16;i++)noise(.07,.22,1200+rnd(1500),i*.06)},drum:()=>{for(let i=0;i<9;i++)snd(100,.12,'sine',.3,50,i*.09);noise(.4,.2,5000,.85)},
boing:()=>{snd(180,.5,'sine',.22,700);snd(700,.3,'sine',.1,300,.25)},tada:()=>{seq([392,523,659],.1,'square',.2,.1);seq([784,1047],.12,'triangle',.5,.18);sfx.clap()}};
function music(on){clearInterval(mus);mus=null;if(!on)return;const P=[262,294,330,392,440,523,440,392],B=[131,131,196,196,175,175,196,196];let i=0;
mus=setInterval(()=>{snd(B[(i>>1)%8],.2,'triangle',.07);if(i%2==0||Math.random()>.5)snd(P[(i*3+rnd(2))%8],.15,'sine',.05);i++},240)}
/* ===== کانفتی و پس‌زمینه ===== */
let cv,cx,parts=[],raf=0;
function confetti(n=120){cv=cv||$('cf');cv.width=innerWidth;cv.height=innerHeight;cx=cv.getContext('2d');
for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.45,vx:(Math.random()-.5)*17,vy:-Math.random()*17-3,s:7+Math.random()*7,c:`hsl(${rnd(360)},90%,62%)`,r:0,vr:(Math.random()-.5)*.4,l:150});
if(!raf)lp()}
function lp(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/40);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});raf=parts.length?requestAnimationFrame(lp):0}
/* ===== تایمر ===== */
let tInt=null;
let SRV=false,FPK=false,GHM=false;
const srvMsg=()=>SRV?'🟢 متصل به سرور پوشه: عکس‌ها و صداها از پوشه‌ی <b>images</b> و <b>sounds</b> خوانده و در آن‌ها ذخیره می‌شوند.':GHM?'☁️ پوشه‌ها از GitHub خوانده شد: '+fa(FB('images'))+' عکس و '+fa(FB('sounds'))+' صدا. (فایل‌های جدید را در GitHub آپلود کن؛ بعد از ~۱ دقیقه خودکار می‌آیند.)':FPK?'📂 پوشه‌ی پروژه خوانده شد: '+fa(FB('images'))+' عکس و '+fa(FB('sounds'))+' صدا.':'⚪ نسخه‌ی مستقیم (بدون سرور): مرورگر خودش پوشه‌ها را نمی‌بیند. یا فایل <b>start-server</b> را اجرا کن، یا در Chrome/Edge کامپیوتر دکمه‌ی زیر را بزن.'+(window.showDirectoryPicker?'<br><button class="btn sm" id="pickdir" style="margin-top:8px">📂 خواندن پوشه‌ی پروژه (images و sounds)</button>':'');
async function ghList(){const h=location.hostname;if(!/\.github\.io$/.test(h))return;const u=h.split('.')[0],sg=location.pathname.split('/')[1],rp=(!sg||/\./.test(sg))?h:sg,o={images:[],sounds:[]},ex={images:/\.(jpe?g|png|webp|gif|svg)$/i,sounds:/\.(mp3|wav|ogg|m4a|aac|webm)$/i};
for(const k of['images','sounds']){try{const x=await fetch('https://api.github.com/repos/'+u+'/'+rp+'/contents/'+k);if(!x.ok)continue;(await x.json()).forEach(f=>{if(f.type=='file'&&ex[k].test(f.name))o[k].push({file:k+'/'+f.name,name:f.name.replace(/\.[^.]+$/,'').replace(/^[0-9]+[-_ .]+/,'').replace(/_/g,' ')})})}catch(e){}}
if(o.images.length||o.sounds.length){window.PARTY_ASSETS=o;GHM=true;if(state.phase=='setup')render()}}
async function pickDir(){const d=await showDirectoryPicker(),o={images:[],sounds:[]};
for(const[k,ex]of[['images',/\.(jpe?g|png|webp|gif|svg)$/i],['sounds',/\.(mp3|wav|ogg|m4a|aac|webm)$/i]]){let h;try{h=await d.getDirectoryHandle(k)}catch(e){continue}
for await(const[n,fh]of h.entries())if(fh.kind=='file'&&ex.test(n)){const f=await fh.getFile();o[k].push({file:URL.createObjectURL(f),name:n.replace(/\.[^.]+$/,'').replace(/^[0-9]+[-_ .]+/,'').replace(/_/g,' ')})}}
window.PARTY_ASSETS=o;FPK=true}
const extOf=b=>{const m={jpeg:'jpg','svg+xml':'svg',mpeg:'mp3',mp4:'m4a','x-m4a':'m4a','x-wav':'wav',wave:'wav'},n=b.name||'';if(n.includes('.'))return n.split('.').pop().toLowerCase();const t=((b.type||'').split('/')[1]||'').split(';')[0];return m[t]||t};
async function srvUp(kind,name,blob){const j=await(await fetch('api/upload?kind='+kind+'&name='+encodeURIComponent(name)+'&ext='+extOf(blob),{method:'POST',body:blob})).json();if(!j.ok)throw new Error(j.error||'خطا');window.PARTY_ASSETS=j.assets}
async function srvDel(kind,file){const j=await(await fetch('api/delete?kind='+kind+'&file='+encodeURIComponent(file),{method:'POST'})).json();if(j.ok)window.PARTY_ASSETS=j.assets}
const FB=k=>((window.PARTY_ASSETS||{})[k]||[]).length;
let curAu=null;const stopAudio=()=>{if(curAu){curAu.pause();curAu=null}const e=document.getElementById('eq');if(e)e.classList.remove('on')};
function stopTimer(){clearInterval(tInt);tInt=null}
function startTimer(sec,onEnd){stopTimer();const tot=sec*1000,st=Date.now();let last=sec;const bar=$('timerBar'),txt=$('timerText');
if(txt)txt.textContent=fa(sec);
tInt=setInterval(()=>{const left=Math.max(0,tot-(Date.now()-st)),s=Math.ceil(left/1000);
if(s!==last){last=s;if(s<=5&&s>0)sfx.urgent();else if(s<=10&&s>0)sfx.tick();if(txt)txt.textContent=fa(s)}
if(bar)bar.style.width=(left/tot*100)+'%';if(left<=0){stopTimer();onEnd()}},60)}
/* ===== بانک صدا (IndexedDB) ===== */
const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open('mc_voices',2);r.onupgradeneeded=()=>{const d=r.result;['v','i'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
const vop=async(st,m,a,w)=>{try{const d=await DB();return await new Promise(r=>{const q=d.transaction(st,w?'readwrite':'readonly').objectStore(st)[m](a);q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}catch(e){return[]}};
const vAll=()=>vop('v','getAll'),vPut=o=>vop('v','put',o,1),vDel=id=>vop('v','delete',id,1),iAll=()=>vop('i','getAll'),iPut=o=>vop('i','put',o,1),iDel=id=>vop('i','delete',id,1);
/* ===== محتوا ===== */
const POEMS=[
{line:'بنی‌آدم اعضای یکدیگرند',ans:'که در آفرینش ز یک گوهرند'},
{line:'چو عضوی به درد آورد روزگار',ans:'دگر عضوها را نماند قرار'},

{line:'به نام خداوند جان و خرد',ans:'کزین برتر اندیشه برنگذرد'},

{line:'هر کسی از ظن خود شد یار من',ans:'از درون من نجست اسرار من'},
{line:'یوسف گمگشته بازآید به کنعان غم مخور',ans:'کلبهٔ احزان شود روزی گلستان غم مخور'},
{line:'دل می‌رود ز دستم صاحبدلان خدا را',ans:'دردا که راز پنهان خواهد شد آشکارا'},

/* ===== حالت تلویزیون ===== */
let wl=null;
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:14px;z-index:120;max-width:90%;text-align:center;font-weight:700';document.body.append(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',6000)}
async function tvMode(){const d=document,e=d.documentElement,on=!d.body.classList.contains('tv');
if(on){const rf=e.requestFullscreen||e.webkitRequestFullscreen;let fs=false;
if(rf){try{await rf.call(e);fs=true}catch(x){}}
try{await screen.orientation.lock('landscape')}catch(x){}
try{wl=await navigator.wakeLock.request('screen')}catch(x){}
d.body.classList.add('tv');$('tvb').textContent='❌ خروج از حالت تلویزیون';
if(!fs)toast('📱 این مرورگر تمام‌صفحه‌ی صفحه را قبول نمی‌کند: گوشی را افقی بگیر (قفل چرخش خاموش باشد) تا تصویر تمام‌صفحه روی تلویزیون بیفتد.')}
else tvOff()}
function tvOff(){const d=document;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d)}catch(x){}
try{screen.orientation.unlock()}catch(x){}try{wl&&wl.release()}catch(x){}wl=null;d.body.classList.remove('tv');const b=$('tvb');if(b)b.textContent='📺 حالت تلویزیون'}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!document.fullscreenElement&&!document.webkitFullscreenElement&&document.body.classList.contains('tv')&&!window._tvNoFs)tvOff()}));
document.body.insertAdjacentHTML('beforeend','<button class="btn ghost sm" id="tvb" style="position:fixed;left:10px;bottom:10px;z-index:50">📺 حالت تلویزیون</button>');
$('tvb').onclick=tvMode;
document.addEventListener('click',()=>{try{ctx()}catch(e){}},{once:true});
if(window.PARTY_QUESTIONS&&!Object.keys(UQ).length)importQ(window.PARTY_QUESTIONS,0);
fetch('api/ping',{cache:'no-store'}).then(x=>x.ok?x.json():{}).then(j=>{if(j&&j.ok){SRV=true;window.PARTY_ASSETS=j.assets;if(state.phase=='setup')render()}}).catch(()=>{});
if(location.protocol.startsWith('http')){ghList();if(!Object.keys(UQ).length)fetch('questions.csv',{cache:'no-store'}).then(x=>x.ok?x.text():'').then(t=>{if(t&&!t.includes('<html')&&importQ(t,0).n&&state.phase=='setup')render()}).catch(()=>{})}
render();
